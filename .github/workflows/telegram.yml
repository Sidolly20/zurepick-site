name: Post to Telegram
# Posts run automatically from the backend. This workflow is only for sending one by hand.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'slips, potd, recap or weekly'
        default: 'slips'
permissions:
  contents: read
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node post-telegram.mjs "${MODE}"
        env:
          MODE: ${{ inputs.mode }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://sidolly20.github.io/zurepick-site
