name: Update match data
on:
  schedule:
    - cron: '0 5,11,16,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node generate.mjs
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          BZZOIRO_KEY: ${{ secrets.BZZOIRO_KEY }}
      # Pages are built separately so a problem here can never block the data update.
      - run: node build-pages.mjs
        continue-on-error: true
        env:
          SITE_URL: https://sidolly20.github.io/zurepick-site
      - run: |
          git config user.name "match-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Update match data" && git push)
